name: Build Pixel PFS iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Native iOS
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app
        run: |
          xcodebuild \
            -project PixelPFS.xcodeproj \
            -scheme PixelPFS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R \
            build/Build/Products/Release-iphoneos/PixelPFS.app \
            Payload/
          zip -qr PixelPFS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PixelPFS-iOS-IPA
          path: PixelPFS-unsigned.ipa
